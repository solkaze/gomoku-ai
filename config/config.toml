# 学習 (Python) と自己対局・対戦 (Rust) の共通設定。
# 相対パスはプロジェクトルートからのパス。

[paths]
# 自己対局データ (*.npz)。Rust が書き出し、Python が読む。
selfplay_dir = "runs/selfplay"
checkpoint_dir = "runs/checkpoints"
# ONNX モデル。latest.onnx を自己対局・対戦で使う。
model_dir = "runs/models"
log_dir = "runs/logs"

[model]
# 新しく作るモデル (init / distill の既定) の大きさ。既存のチェックポイントはそれ自身の大きさで読む
channels = 192
blocks = 15

[train]
device = "cuda"
batch_size = 512
# 新しい局面 1 つあたり何サンプル分学習するか (1 回の学習ステップ数 = 新局面数 × これ / batch_size)。
# 各局面がリプレイバッファにいる間に平均何回使われるかに相当する。大きすぎると過学習する。
samples_per_position = 4
# リプレイバッファの局面数がこれに達するまでは自己対局だけ行う
min_replay = 50_000
# 学習率のスケジュール: [累計ステップ数, 学習率] のリスト。そのステップ以降はその学習率を使う
# (adopt で取り込んだときは 0 から数え直す)
lr_schedule = [[0, 2e-4], [100_000, 1e-4]]
weight_decay = 1e-4
# 学習に使う直近の局面数
# 1 イテレーションの新しい局面 (playout cap randomization で約 4,000) の 50 回分ほど
replay_window = 200_000
value_loss_weight = 1.0
# CUDA では bfloat16 の自動混合精度を使う
amp = true
# ONNX を float16 で書き出す (推論が約 1.5 倍速くなる。入出力は float32 のまま)
export_fp16 = true

[loop]
# `cargo build --release` で作るバイナリ
selfplay_bin = "target/release/selfplay"
evaluate_bin = "target/release/evaluate"
# このファイルを置くと、学習ループは今の段階が終わったところで停止する (停止時に削除される)
stop_file = "runs/STOP"
# 残すチェックポイントと ONNX: 直近 keep_last 個と、keep_every イテレーションごとのもの
keep_last = 3
keep_every = 50

[selfplay]
# 1 回の実行で打つ局数
games = 500
# 同時に進める対局数 (スレッド数)
workers = 128
simulations = 800
# 1 対局の探索が一度に評価へ出す葉の数
mcts_batch_size = 8
c_puct = 1.5
fpu_reduction = 0.2
dirichlet_alpha = 0.03
dirichlet_epsilon = 0.25
# 開局のあと、この手数は訪問回数に比例して手を選ぶ (序盤の多様性のため)
temperature_moves = 10
# 開局のランダム化: 黒の初手 (天元) のあと、0〜この手数 (局ごとに一様に選ぶ) を石の近くにランダムに打ってから
# 対局を始める。黒必勝の初期局面ばかりにならないようにするため。0 で無効
opening_moves = 4
# 互角の開局: opening_balance_games の割合の局で、ランダムな開局を opening_balance_simulations 回の探索 (ノイズなし)
# で評価し、手番側から見た価値の絶対値が opening_balance 以下のものだけを使う (100 回試して見つからなければ最も互角に
# 近いもの)。黒が 7 割以上勝つ開局ばかりだと勝敗から学べることが少ないため。
# 互角の開局には通常の開局 (天元と白の 2 手目だけ) が入らないので、残りの局は今までどおりの開局にする。1.0 で無効
opening_balance = 0.3
opening_balance_simulations = 100
opening_balance_games = 0.5
# 探索のルートで VCF (四の連続での勝ち) を読み、自分の VCF は必ず打ち、相手に VCF を許す手は候補から外す。
# 評価 (ゲーティング) にも同じ値を使う。人との対戦 (gomoku) では設定によらず有効 (--no-vcf で無効)
vcf = true
# playout cap randomization (KataGo): 各手をこの確率で通常の探索 (simulations 回、ノイズあり) にし、
# それ以外は fast_simulations 回・ノイズなしの速い探索で打つ。学習データにするのは通常の探索をした局面だけ。1.0 で無効
full_search_prob = 0.25
fast_simulations = 100
# 1 ファイルにまとめる局数
games_per_file = 100

[play]
# 人と AI の対戦 (gomoku) の記録 (棋譜・各手の時間・AI の評価値と候補手) を 1 局 1 ファイルの JSON で書き出す先。
# gomoku --no-record で書き出さない
record_dir = "runs/games"
# 勝ち負けがはっきりした局面 (評価値の絶対値が 0.8 超) で、負けているときは終局を遠ざける手、勝っているときは早く
# 終わる手を選ぶ強さ。残り手数の差に応じて評価値に足す値の上限 (評価値が ±1 のとき)。0 で無効。
# 負けの局面では評価がどの手も -1 近くに張り付き、粘る手を選ぶ理由がなくなるため。自己対局・評価には使わない
moves_left_effect = 0.05

[inference]
# "cuda" または "cpu"
device = "cuda"
# GPU に一度に渡す最大局面数
max_batch = 256
# 推論スレッド数。2 以上にするとバッチの収集と GPU 推論が並行する
threads = 2
# onnxruntime の共有ライブラリの場所 (venv の onnxruntime-gpu のものを使う)
onnxruntime_dir = ".venv/lib/python3.14/site-packages/onnxruntime/capi"
# CUDA 13 / cuDNN 9 のライブラリの場所 (venv の torch に同梱のものを使う)
cuda_lib_dirs = [
    ".venv/lib/python3.14/site-packages/nvidia/cu13/lib",
    ".venv/lib/python3.14/site-packages/nvidia/cudnn/lib",
]

[evaluate]
# 対戦 (ゲーティングと基準モデルとの対戦) の設定
# evaluate バイナリを --games なしで実行したときの局数
games = 200
simulations = 200
# 開局のあと、この手数は訪問回数に比例して手を選ぶ (毎局同じ棋譜になるのを防ぐ)
temperature_moves = 6
# 開局のランダム化 (selfplay.opening_moves と同じ)。同じ開局を先後入れ替えて 1 局ずつ打つ
opening_moves = 4

[gating]
# 自己対局には最強モデル (model_dir/best.onnx) だけを使う。interval イテレーションごとに最新モデルと games 局
# 打たせ、勝率が threshold 以上なら最強モデルを置き換える。
# 0.50 は「弱くなっていなければ置き換える」。0.55 (偶然ではまず出ない差) だと最強モデルが入れ替わらず、
# 自己対局のデータが同じ強さのまま学習が頭打ちになった (2026-10 の iter 1920〜2030)
interval = 10
games = 400
threshold = 0.50
# 強さの基準にする固定のモデル。最強モデルが入れ替わるたびに anchor_games 局打たせ、基準からの Elo を記録する。
# なければ学習ループの開始時に最新モデルをここにコピーする
anchor = "runs/models/anchor.onnx"
anchor_games = 400
