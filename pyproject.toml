[project]
name = "gomoku-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "solkaze", email = "solkaze.arch.tech@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "onnx>=1.23.0",
    "onnxscript>=0.7.2",
    "scipy>=1.18.1",
    "tensorboard>=2.21.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "tqdm>=4.70.1",
]

[project.scripts]
gomoku-ai = "gomoku_ai:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "onnxruntime>=1.30.0",
    "pytest>=9.1.1",
]
