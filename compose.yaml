# 学習サーバー用。GPU には NVIDIA Container Toolkit が必要。
#
#   mkdir -p runs                         # 先に作っておく (ないと Docker が root 所有で作ってしまう)
#   docker compose up -d --build train    # 学習ループを開始 (中断・再起動しても続きから)
#   docker compose logs -f train          # 進捗を見る
#   touch runs/STOP                       # 今の段階が終わったところで停止する
#   docker compose up -d tensorboard      # http://<サーバー>:6006 で学習曲線と Elo を見る
#   docker compose up -d --build web      # http://<サーバーの IP>:39115 でブラウザから AI と対戦する
#
# runs/ に書き出すファイルがホストのユーザーの所有になるよう、そのユーザーで動かす。
# UID/GID が 1000 でない場合は、同じディレクトリの .env に `UID=...` と `GID=...` を書く (`id -u`, `id -g` で確認)。
services:
  train:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: train
    image: gomoku-ai-train
    user: "${UID:-1000}:${GID:-1000}"
    init: true
    # 異常終了したときだけ再起動する (runs/STOP による正常停止では再起動しない)
    restart: on-failure
    volumes:
      - ./runs:/workspace/runs
      - ./config:/workspace/config:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ブラウザで AI と対戦するサーバー。学習 (train) とは独立に起動・停止できる。
  # モデルは runs/models/best.onnx を使い、ゲーティングで置き換わったら次の手から新しいものを使う。
  # サーバーの IP を知っていれば誰でも開ける (全てのインターフェースに公開)。このマシンからだけにするときは
  # .env に WEB_BIND=127.0.0.1 と書く。ポートは .env の WEB_PORT、AI の 1 手あたりの探索回数は WEB_SIMULATIONS で変えられる。
  # 学習と GPU を分け合うので、学習中は 6000 回で 1 手 5 秒ほど (16000 回だと 14 秒ほど)
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: gomoku-ai-web
    command: ["target/release/web", "--addr", "0.0.0.0:39115", "--simulations", "${WEB_SIMULATIONS:-6000}"]
    user: "${UID:-1000}:${GID:-1000}"
    init: true
    restart: on-failure
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-39115}:39115"
    volumes:
      - ./runs/models:/workspace/runs/models:ro
      - ./config:/workspace/config:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tensorboard:
    image: gomoku-ai-train
    user: "${UID:-1000}:${GID:-1000}"
    command: ["uv", "run", "--no-sync", "tensorboard", "--logdir", "runs/logs", "--host", "0.0.0.0"]
    ports:
      - "6006:6006"
    volumes:
      - ./runs:/workspace/runs:ro
    depends_on:
      - train
